name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GITHUB_TOKEN to commit to gh-pages branch and GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Bundle
        env:
          VITE_BASE_PATH: './'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://atmnwxgvnfsrinqrzvij.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_15I7OtmTepRBdcB8mEUG8A_t_65x7Ls' }}
        run: npm run build

      # 1. Pushes built dist folder to the "gh-pages" branch
      # This allows GitHub Pages Source: "Deploy from a branch" (gh-pages)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

      # 2. Also prepare GitHub Pages direct deployment if "GitHub Actions" source is used
      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
