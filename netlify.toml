# Netlify Configuration for Sattva Living Wellness Community

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures client-side routing with react-router-dom works seamlessly on page refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
