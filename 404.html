<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages Hash Router fallback redirect
      (function() {
        var l = window.location;
        var path = l.pathname;
        var segments = path.split('/').filter(Boolean);
        // If hosted on GitHub Pages as a project repository (username.github.io/repo-name)
        var isGithubIo = l.hostname.endsWith('github.io');
        var repo = (isGithubIo && segments.length > 0) ? segments[0] : '';
        var remainingPath = (isGithubIo && segments.length > 0) 
          ? segments.slice(1).join('/') 
          : segments.join('/');
        
        var targetPath = repo ? ('/' + repo) : '';
        var targetRoute = remainingPath ? ('/' + remainingPath) : '/';
        var search = l.search || '';
        var hash = l.hash || '';

        var redirectUrl = l.protocol + '//' + l.host + targetPath + '/#' + targetRoute + search + hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to application...</p>
  </body>
</html>
